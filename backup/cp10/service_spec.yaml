---
spec:
  containers:
  - name: "app"
    image: "sfseapac-snowflake-sap-apj.registry.snowflakecomputing.com/acoco_db/app/images/acoco_command_center:v5"
    sha256: "@sha256:fc90bcdf9de01ad904913ac103284383f3127c15e204a888dd4c94554fb9e5e4"
    env:
      PORT: "8080"
      SNOWFLAKE_WAREHOUSE: "WH_ACOCO_APP"
      ACOCO_AS_OF: "2026-10-01"
    readinessProbe:
      port: 8080
      path: "/healthcheck"
    resources:
      limits:
        memory: "2Gi"
        cpu: "1"
      requests:
        memory: "1Gi"
        cpu: "500m"
  endpoints:
  - name: "ui"
    port: 8080
    public: true

