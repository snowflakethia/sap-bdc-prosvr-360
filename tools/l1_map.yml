  WORKFORCE:
    allowed: [COREWORKFORCEDATA_V1, ASSIGNMENTADDITIONALINFORMATION_V1, ACOCO_SIM.COREWORKFORCE, ACOCO_SIM.DIRECTORY,
              ACOCO_SIM.PERFORMANCE, ACOCO_SIM.COMPENSATION, ACOCO_SIM.SUCCESSION]
    objects:
      WORKFORCE_JOB:
        key: [PERSON_ID, VALID_FROM, VALID_TO, EVENT_REASON]
        columns: {PERSON_ID: VARCHAR, VALID_FROM: DATE, VALID_TO: DATE, EMPLOYMENT_STATUS: VARCHAR, EVENT_REASON: VARCHAR,
                  MOVE_OUT_REASON: VARCHAR, IS_TERMINATION: BOOLEAN, IS_HIRE: BOOLEAN, PAY_GRADE: NUMBER,
                  PAY_GRADE_IMPUTED: BOOLEAN, LEVEL: VARCHAR, BILL_CODE: NUMBER, SF_COST_CENTER: VARCHAR,
                  COST_CENTER_ID: VARCHAR, MD_GROUP_ID: VARCHAR, MANAGER_ID: VARCHAR, FTE: 'NUMBER(5,2)',
                  TENURE_MONTHS: NUMBER, TENURE_START: DATE, ANNUAL_SALARY: 'NUMBER(14,2)',
                  SALARY_MIDPOINT: 'NUMBER(14,2)', GENDER: VARCHAR}
        sources:
          - system: BDC_CLD
            from: COREWORKFORCEDATA_V1."coreworkforcedata"."coreworkforce_standardfields" w
            joins: |
              LEFT JOIN ACOCO_DB.OPS.MAP_PAYGRADE_LEVEL pg ON pg.PAY_GRADE = COALESCE(w."payGrade", 61)
              LEFT JOIN ACOCO_DB.OPS.MAP_SF_COSTCENTER sc ON sc.SF_COST_CENTER = COALESCE(w."costCenter"::VARCHAR, 'UNASSIGNED')
            select: {PERSON_ID: 'w."userId"', VALID_FROM: 'w."startDate"', VALID_TO: 'w."endDate"', EMPLOYMENT_STATUS: 'w."employmentStatus"',
                     EVENT_REASON: 'w."eventReasonCode"', MOVE_OUT_REASON: 'w."moveOutReason"',
                     IS_TERMINATION: 'COALESCE(w."terminations", 0) > 0', IS_HIRE: 'COALESCE(w."externalHires", 0) > 0',
                     PAY_GRADE: 'COALESCE(w."payGrade", 61)', PAY_GRADE_IMPUTED: 'w."payGrade" IS NULL', LEVEL: pg.LEVEL,
                     BILL_CODE: pg.BILL_CODE, SF_COST_CENTER: 'COALESCE(w."costCenter"::VARCHAR, ''UNASSIGNED'')',
                     COST_CENTER_ID: sc.COST_CENTER, MD_GROUP_ID: sc.MD_GROUP_ID, MANAGER_ID: 'w."managerId"', FTE: 'w."fte"',
                     TENURE_MONTHS: 'TRY_TO_NUMBER(w."organizationalTenure")', TENURE_START: 'w."tenureStartDate"',
                     ANNUAL_SALARY: 'w."annualSalary"', SALARY_MIDPOINT: 'w."midPoint"', GENDER: 'w."gender"'}
          - system: SIMULATED
            from: ACOCO_SIM.COREWORKFORCE.COREWORKFORCE_STANDARDFIELDS w
            joins: |
              LEFT JOIN ACOCO_DB.OPS.MAP_PAYGRADE_LEVEL pg ON pg.PAY_GRADE = w."payGrade"
              LEFT JOIN ACOCO_DB.OPS.MAP_SF_COSTCENTER sc ON sc.SF_COST_CENTER = w."costCenter"
            select: {PERSON_ID: 'w."userId"', VALID_FROM: 'w."startDate"', VALID_TO: 'w."endDate"', EMPLOYMENT_STATUS: 'w."employmentStatus"',
                     EVENT_REASON: 'w."eventReasonCode"', MOVE_OUT_REASON: 'w."moveOutReason"',
                     IS_TERMINATION: 'COALESCE(w."terminations", 0) > 0', IS_HIRE: 'COALESCE(w."externalHires", 0) > 0',
                     PAY_GRADE: 'w."payGrade"', PAY_GRADE_IMPUTED: 'FALSE', LEVEL: pg.LEVEL, BILL_CODE: pg.BILL_CODE,
                     SF_COST_CENTER: 'w."costCenter"', COST_CENTER_ID: sc.COST_CENTER, MD_GROUP_ID: sc.MD_GROUP_ID,
                     FTE: 'w."fte"', TENURE_MONTHS: 'TRY_TO_NUMBER(w."organizationalTenure")', TENURE_START: 'w."tenureStartDate"',
                     ANNUAL_SALARY: 'w."annualSalary"', SALARY_MIDPOINT: 'w."midPoint"', GENDER: 'w."gender"'}

      PERSON_DIRECTORY:
        key: [PERSON_ID]
        columns: {PERSON_ID: VARCHAR, FIRST_NAME: VARCHAR, LAST_NAME: VARCHAR, DISPLAY_NAME: VARCHAR, IS_SIMULATED_PERSON: BOOLEAN}
        sources:
          - system: SIMULATED
            from: ACOCO_SIM.DIRECTORY.PERSON_NAME n
            select: {PERSON_ID: n.USER_ID, FIRST_NAME: n.FIRST_NAME, LAST_NAME: n.LAST_NAME,
                     DISPLAY_NAME: "n.FIRST_NAME || ' ' || n.LAST_NAME", IS_SIMULATED_PERSON: "n.USER_ID LIKE 'S9%'"}

      MD_ROLE:
        key: [MD_GROUP_ID]
        columns: {PERSON_ID: VARCHAR, MD_GROUP_ID: VARCHAR, ROLE: VARCHAR, VALID_FROM: DATE}
        sources:
          - system: SIMULATED
            from: ACOCO_SIM.DIRECTORY.MD_ROLE r
            select: {PERSON_ID: r.USER_ID, MD_GROUP_ID: r.MD_GROUP_ID, ROLE: r.ROLE, VALID_FROM: r.VALID_FROM}

      JOB_RELATIONSHIP:
        key: [RELATIONSHIP_ID]
        columns: {RELATIONSHIP_ID: VARCHAR, ASSIGNMENT_ID: VARCHAR, PERSON_ID: VARCHAR}
        sources:
          - system: BDC_CLD
            from: ASSIGNMENTADDITIONALINFORMATION_V1."assignmentadditionalinformation"."jobrelationship" j
            joins: LEFT JOIN ACOCO_DB.OPS.MAP_ASSIGNMENT_USER m ON m.ASSIGNMENT_ID = j."assignmentId"
            select: {RELATIONSHIP_ID: 'j."id"', ASSIGNMENT_ID: 'j."assignmentId"', PERSON_ID: m.USER_ID}

      PERFORMANCE_RATING:
        key: [PERSON_ID, FISCAL_YEAR]
        columns: {PERSON_ID: VARCHAR, FISCAL_YEAR: NUMBER, RATING_DATE: DATE, PERFORMANCE_RATING: NUMBER}
        sources:
          - system: SIMULATED
            from: ACOCO_SIM.PERFORMANCE.PERFORMANCE_RATING r
            select: {PERSON_ID: r.USER_ID, FISCAL_YEAR: r.FISCAL_YEAR, RATING_DATE: r.RATING_DATE, PERFORMANCE_RATING: r.PERFORMANCE_RATING}

      COMPENSATION_SUMMARY:
        key: [PERSON_ID]
        columns: {PERSON_ID: VARCHAR, LEVEL: VARCHAR, PAY_BAND: VARCHAR, COMPA_RATIO: 'NUMBER(6,3)'}
        sources:
          - system: SIMULATED
            from: ACOCO_SIM.COMPENSATION.COMPENSATION_SUMMARY c
            select: {PERSON_ID: c.USER_ID, LEVEL: c.LEVEL, PAY_BAND: c.PAY_BAND, COMPA_RATIO: c.COMPA_RATIO}

      SUCCESSION_NOMINATION:
        key: [PERSON_ID]
        columns: {PERSON_ID: VARCHAR, NOMINATION_TYPE: VARCHAR, HAS_READY_SUCCESSOR: BOOLEAN}
        sources:
          - system: SIMULATED
            from: ACOCO_SIM.SUCCESSION.NOMINATION n
            select: {PERSON_ID: n.USER_ID, NOMINATION_TYPE: n.NOMINATION_TYPE, HAS_READY_SUCCESSOR: n.HAS_READY_SUCCESSOR}

