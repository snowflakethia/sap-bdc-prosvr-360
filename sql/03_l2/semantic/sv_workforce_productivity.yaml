verified_queries:
- name: vq_1
  question: What was the median WPS and billability by level in FY26?
  sql: "SELECT LEVEL, ROUND(WPS_MEDIAN, 1) AS MEDIAN_WPS, ROUND(100 * BILLABILITY_MEDIAN, 1) AS MEDIAN_BILLABILITY_PCT,\n\
    \       ROUND(100 * UTILIZATION_MEDIAN, 1) AS MEDIAN_UTILIZATION_PCT\nFROM ACOCO_L2.REASONING.WPS_BY_LEVEL WHERE SCOPE\
    \ = 'FIRM' AND FISCAL_YEARS = 'FY26' AND CELL_STATUS = 'OK'\nORDER BY LEVEL_SORT"
  verified_by: ACoCo build (CP-07)
  verified_at: 1793059200
  use_as_onboarding_question: true
- name: vq_2
  question: Which AI products are significantly associated with WPS, by level?
  sql: "SELECT STRATUM, EXPOSURE, OUTCOME, ROUND(RHO, 3) AS RHO, ROUND(CI_LOW, 3) AS CI_LOW, ROUND(CI_HIGH, 3) AS CI_HIGH\n\
    FROM ACOCO_L2.REASONING.VENDOR_WPS_TEST\nWHERE SCOPE = 'FIRM' AND FISCAL_YEARS NOT LIKE '%pooled' AND EXPOSURE_KIND =\
    \ 'PRODUCT' AND OUTCOME = 'WPS'\n  AND SIGNIFICANT AND CELL_STATUS = 'OK'\nORDER BY STRATUM, RHO DESC"
  verified_by: ACoCo build (CP-07)
  verified_at: 1793059200
  use_as_onboarding_question: false
- name: vq_3
  question: What was average WPS by MD group in FY26?
  sql: 'SELECT g.MD_GROUP_NAME, ROUND(AVG(w.WPS), 1) AS AVG_WPS

    FROM ACOCO_L2.WORKFORCE_PERFORMANCE.DT_PERSON_QUARTER_WPS w

    JOIN ACOCO_L2.ONTOLOGY.ENT_PERSON p ON p.PERSON_ID = w.PERSON_ID

    JOIN ACOCO_L2.ONTOLOGY.ENT_MD_GROUP g ON g.MD_GROUP_ID = p.MD_GROUP_ID

    JOIN ACOCO_L2.CORE.DT_FISCAL_MONTH f ON f.MONTH_START = w.Q_START

    WHERE f.FISCAL_YEAR = 2026 GROUP BY g.MD_GROUP_NAME ORDER BY AVG_WPS DESC'
  verified_by: ACoCo build (CP-07)
  verified_at: 1793059200
  use_as_onboarding_question: false
custom_instructions: Fiscal years run October to September (FY26 = Oct 2025 - Sep 2026); the as-of date is 1 Oct 2026, so
  FY26 is the last closed year. Percentages are 0-100. Filter MD groups by md_group name (e.g. 'Financial Services').
