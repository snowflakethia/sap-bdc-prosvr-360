name: SV_WORKFORCE_PERFORMANCE
description: 'People pillar: five-way time mix (Delivery, Bid, Learning, Admin, Bench) vs level targets, productivity, headcount,
  attrition, roll-off and skills. Use for billability, bench, time mix, headcount and roll-off questions.'
tables:
- name: person
  description: Shared ontology entity PERSON (ACOCO_L2.ONTOLOGY.ENT_PERSON)
  base_table:
    database: ACOCO_L2
    schema: ONTOLOGY
    table: ENT_PERSON
  primary_key:
    columns:
    - PERSON_ID
  dimensions:
  - name: person_id
    expr: PERSON_ID
    data_type: VARCHAR
    description: People Intelligence userId
    synonyms:
    - employee id
    - user id
  - name: person_name
    expr: DISPLAY_NAME
    data_type: VARCHAR
    description: Person's display name
    synonyms:
    - name
    - employee
    - consultant
  - name: person_level
    expr: LEVEL
    data_type: VARCHAR
    description: Career level at the as-of date (Analyst .. Principal)
    synonyms:
    - level
    - grade
    - rank
  - name: bill_code
    expr: BILL_CODE
    data_type: NUMBER
    description: Bill code 30-79 within the level band (higher = more senior, more bid time)
    synonyms:
    - billing code
  - name: is_active
    expr: IS_ACTIVE_AS_OF
    data_type: BOOLEAN
    description: Employed on the as-of date (1 Oct 2026)
    synonyms:
    - active
    - current employee
  - name: is_managing_director
    expr: IS_MANAGING_DIRECTOR
    data_type: BOOLEAN
    description: Holds the Managing Director role for a group
    synonyms:
    - MD
  - name: person_source
    expr: SOURCE_SYSTEM
    data_type: VARCHAR
    description: BDC_CLD = real People Intelligence person; SIMULATED = simulated pool
- name: md_group
  description: Shared ontology entity MD_GROUP (ACOCO_L2.ONTOLOGY.ENT_MD_GROUP)
  base_table:
    database: ACOCO_L2
    schema: ONTOLOGY
    table: ENT_MD_GROUP
  primary_key:
    columns:
    - MD_GROUP_ID
  dimensions:
  - name: md_group_id
    expr: MD_GROUP_ID
    data_type: VARCHAR
    description: MD group code (FS, CMT, HPS, PRD, RES, XAI)
    synonyms:
    - group code
  - name: md_group
    expr: MD_GROUP_NAME
    data_type: VARCHAR
    description: MD group name, e.g. Financial Services
    synonyms:
    - group
    - industry group
    - practice
  - name: managing_director
    expr: MANAGING_DIRECTOR_NAME
    data_type: VARCHAR
    description: Managing Director of the group
    synonyms:
    - MD name
    - partner
- name: level
  description: Shared ontology entity LEVEL (ACOCO_L2.ONTOLOGY.ENT_LEVEL)
  base_table:
    database: ACOCO_L2
    schema: ONTOLOGY
    table: ENT_LEVEL
  primary_key:
    columns:
    - LEVEL
  dimensions:
  - name: level
    expr: LEVEL
    data_type: VARCHAR
    description: Career level
    synonyms:
    - grade
  - name: level_sort
    expr: LEVEL_SORT
    data_type: NUMBER
    description: 1 = Analyst .. 5 = Principal
  - name: activity_type
    expr: ACTIVITY_TYPE
    data_type: VARCHAR
    description: S/4 activity type that prices the level (ML-100 .. ML-105)
- name: fiscal_month
  description: Shared ontology entity FISCAL_MONTH (ACOCO_L2.CORE.DT_FISCAL_MONTH)
  base_table:
    database: ACOCO_L2
    schema: CORE
    table: DT_FISCAL_MONTH
  primary_key:
    columns:
    - MONTH_START
  dimensions:
  - name: fiscal_year
    expr: FISCAL_YEAR
    data_type: NUMBER
    description: ACoCo fiscal year (Oct-Sep, V9); FY26 = Oct 2025 - Sep 2026
    synonyms:
    - FY
    - year
  - name: fiscal_period
    expr: FISCAL_PERIOD
    data_type: NUMBER
    description: Fiscal period 1-12 (1 = October)
    synonyms:
    - period
  - name: fiscal_quarter
    expr: FISCAL_QUARTER
    data_type: NUMBER
    description: Fiscal quarter 1-4 (1 = Oct-Dec)
    synonyms:
    - quarter
  - name: month_label
    expr: MONTH_LABEL
    data_type: VARCHAR
    description: Calendar month label, e.g. SEP 2026
    synonyms:
    - month
  time_dimensions:
  - name: month_start
    expr: MONTH_START
    data_type: DATE
    description: First day of the fiscal month (join key)
- name: skill
  description: Shared ontology entity SKILL (ACOCO_L2.ONTOLOGY.ENT_SKILL)
  base_table:
    database: ACOCO_L2
    schema: ONTOLOGY
    table: ENT_SKILL
  primary_key:
    columns:
    - SKILL_ID
  dimensions:
  - name: skill_id
    expr: SKILL_ID
    data_type: VARCHAR
    description: Skill code
  - name: skill_name
    expr: SKILL_NAME
    data_type: VARCHAR
    description: Skill name
    synonyms:
    - skill
    - capability
  - name: skill_family
    expr: SKILL_FAMILY
    data_type: VARCHAR
    description: AGENTIC_AI, TECHNICAL or INDUSTRY
    synonyms:
    - skill category
- name: time_category
  description: Shared ontology entity TIME_CATEGORY (ACOCO_L2.ONTOLOGY.ENT_TIME_CATEGORY)
  base_table:
    database: ACOCO_L2
    schema: ONTOLOGY
    table: ENT_TIME_CATEGORY
  primary_key:
    columns:
    - TIME_CATEGORY
  dimensions:
  - name: time_category
    expr: TIME_CATEGORY
    data_type: VARCHAR
    description: DELIVERY, BID, LEARNING, ADMIN or BENCH
    synonyms:
    - use of time
    - category
  - name: time_category_objective
    expr: OBJECTIVE
    data_type: VARCHAR
    description: What the category is judged on
- name: scorecard
  description: Fact WORKFORCE_PERFORMANCE.DT_PERSON_MONTH_SCORECARD
  base_table:
    database: ACOCO_L2
    schema: WORKFORCE_PERFORMANCE
    table: DT_PERSON_MONTH_SCORECARD
  primary_key:
    columns:
    - PERSON_MONTH_ID
  facts:
  - name: available_hours
    expr: AVAILABLE_HOURS
    data_type: NUMBER
    description: Available hours
  - name: delivery_hours
    expr: DELIVERY_HOURS
    data_type: NUMBER
    description: Delivery hours
  - name: bid_hours
    expr: BID_HOURS
    data_type: NUMBER
    description: Bid hours
  - name: learning_hours
    expr: LEARNING_HOURS
    data_type: NUMBER
    description: Learning hours
  - name: admin_hours
    expr: ADMIN_HOURS
    data_type: NUMBER
    description: Admin hours
  - name: bench_hours
    expr: BENCH_HOURS
    data_type: NUMBER
    description: Bench hours
  - name: bench_cost
    expr: BENCH_COST
    data_type: NUMBER
    description: Bench cost USD
  - name: earned_hours
    expr: EARNED_HOURS
    data_type: NUMBER
    description: Earned hours
  metrics:
  - name: delivery_pct
    expr: 100 * SUM(delivery_hours) / NULLIF(SUM(available_hours), 0)
    description: 'Billability: Delivery hours as % of available hours (Employee Availability)'
    synonyms:
    - billability
    - utilisation of delivery
  - name: bid_pct
    expr: 100 * SUM(bid_hours) / NULLIF(SUM(available_hours), 0)
    description: Bid (pre-sales) hours as % of available hours
    synonyms:
    - presales share
  - name: learning_pct
    expr: 100 * SUM(learning_hours) / NULLIF(SUM(available_hours), 0)
    description: Learning hours as % of available hours
  - name: admin_pct
    expr: 100 * SUM(admin_hours) / NULLIF(SUM(available_hours), 0)
    description: Admin hours as % of available hours (ceiling 5 %)
  - name: bench_pct
    expr: 100 * SUM(bench_hours) / NULLIF(SUM(available_hours), 0)
    description: Bench = available minus booked hours, % of available (target ~2 %, < 3 %)
    synonyms:
    - idle time
    - unutilised
  - name: available_hours_total
    expr: SUM(available_hours)
    description: Available hours (planned work hours minus absence)
    synonyms:
    - capacity
  - name: total_bench_cost
    expr: SUM(bench_cost)
    description: Bench hours x level cost rate (USD)
  - name: total_productivity_index
    expr: SUM(earned_hours) / NULLIF(SUM(delivery_hours), 0)
    description: Earned hours / actual delivery hours (> 1 = faster than plan)
    synonyms:
    - productivity
- name: time_booking
  description: Fact WORKFORCE_PERFORMANCE.DT_PERSON_MONTH_TIME
  base_table:
    database: ACOCO_L2
    schema: WORKFORCE_PERFORMANCE
    table: DT_PERSON_MONTH_TIME
  primary_key:
    columns:
    - PERSON_MONTH_TIME_ID
  facts:
  - name: hours
    expr: HOURS
    data_type: NUMBER
    description: Hours in the time category
  - name: available_hours
    expr: AVAILABLE_HOURS
    data_type: NUMBER
    description: Person-month available hours
  - name: target_pct
    expr: TARGET_PCT
    data_type: NUMBER
    description: Level target % for the category
  metrics:
  - name: category_share_pct
    expr: 100 * SUM(hours) / NULLIF(SUM(available_hours), 0)
    description: Hours of the time category as % of available hours
    synonyms:
    - time mix
- name: headcount
  description: Fact WORKFORCE_PERFORMANCE.DT_HEADCOUNT_MONTH
  base_table:
    database: ACOCO_L2
    schema: WORKFORCE_PERFORMANCE
    table: DT_HEADCOUNT_MONTH
  facts:
  - name: closing_headcount
    expr: CLOSING_HEADCOUNT
    data_type: NUMBER
    description: Month-end headcount
  - name: voluntary_leavers
    expr: VOLUNTARY_LEAVERS
    data_type: NUMBER
    description: Voluntary leavers
  - name: hires
    expr: HIRES
    data_type: NUMBER
    description: Hires
  metrics:
  - name: headcount_closing
    expr: SUM(closing_headcount)
    description: Headcount at month end (sum over a single month only)
    synonyms:
    - headcount
    - FTE
  - name: total_voluntary_leavers
    expr: SUM(voluntary_leavers)
    description: Voluntary leavers
    synonyms:
    - attrition count
    - quits
  - name: total_hires
    expr: SUM(hires)
    description: Hires
- name: roll_off
  description: Fact WORKFORCE_PERFORMANCE.DT_ROLL_OFF
  base_table:
    database: ACOCO_L2
    schema: WORKFORCE_PERFORMANCE
    table: DT_ROLL_OFF
  primary_key:
    columns:
    - PERSON_ID
  time_dimensions:
  - name: roll_off_date
    expr: ROLL_OFF_DATE
    data_type: DATE
    description: Last assignment end date
  facts:
  - name: roll_off_person_key
    expr: PERSON_ID
    data_type: VARCHAR
    description: Person rolling off
  - name: below_pipeline_ai_level
    expr: BELOW_PIPELINE_AI_LEVEL
    data_type: BOOLEAN
    description: Below pipeline AI level
  metrics:
  - name: roll_off_people
    expr: COUNT(roll_off_person_key)
    description: People whose last assignment ends in the 90 days after the as-of date
    synonyms:
    - roll-offs
  - name: roll_off_below_ai_level
    expr: SUM(IFF(below_pipeline_ai_level, 1, 0))
    description: Roll-offs below the pipeline's required AI-skill level
- name: person_skill
  description: Fact ONTOLOGY.REL_PERSON_SKILL
  base_table:
    database: ACOCO_L2
    schema: ONTOLOGY
    table: REL_PERSON_SKILL
  facts:
  - name: proficiency
    expr: PROFICIENCY
    data_type: NUMBER
    description: Latest proficiency 1-5
  metrics:
  - name: avg_proficiency
    expr: AVG(proficiency)
    description: Average skill proficiency (1-5)
