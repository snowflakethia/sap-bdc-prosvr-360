verified_queries:
- name: vq_1
  question: What was the FY26 time mix by level for Financial Services?
  sql: "SELECT p.LEVEL, ROUND(100 * SUM(s.DELIVERY_HOURS) / SUM(s.AVAILABLE_HOURS), 1) AS DELIVERY_PCT,\n       ROUND(100\
    \ * SUM(s.BID_HOURS) / SUM(s.AVAILABLE_HOURS), 1) AS BID_PCT,\n       ROUND(100 * SUM(s.LEARNING_HOURS) / SUM(s.AVAILABLE_HOURS),\
    \ 1) AS LEARNING_PCT,\n       ROUND(100 * SUM(s.ADMIN_HOURS) / SUM(s.AVAILABLE_HOURS), 1) AS ADMIN_PCT,\n       ROUND(100\
    \ * SUM(s.BENCH_HOURS) / SUM(s.AVAILABLE_HOURS), 1) AS BENCH_PCT\nFROM ACOCO_L2.WORKFORCE_PERFORMANCE.DT_PERSON_MONTH_SCORECARD\
    \ s\nJOIN ACOCO_L2.ONTOLOGY.ENT_PERSON p ON p.PERSON_ID = s.PERSON_ID\nJOIN ACOCO_L2.ONTOLOGY.ENT_MD_GROUP g ON g.MD_GROUP_ID\
    \ = p.MD_GROUP_ID\nJOIN ACOCO_L2.CORE.DT_FISCAL_MONTH f ON f.MONTH_START = s.MONTH_START\nWHERE g.MD_GROUP_NAME = 'Financial\
    \ Services' AND f.FISCAL_YEAR = 2026\nGROUP BY p.LEVEL, p.LEVEL_SORT ORDER BY p.LEVEL_SORT"
  verified_by: ACoCo build (CP-07)
  verified_at: 1793059200
  use_as_onboarding_question: true
- name: vq_2
  question: How many Financial Services people roll off in the next 90 days and how many are below the pipeline AI-skill level?
  sql: 'SELECT COUNT(*) AS ROLL_OFF_PEOPLE, SUM(IFF(r.BELOW_PIPELINE_AI_LEVEL, 1, 0)) AS BELOW_AI_LEVEL

    FROM ACOCO_L2.WORKFORCE_PERFORMANCE.DT_ROLL_OFF r

    JOIN ACOCO_L2.ONTOLOGY.ENT_PERSON p ON p.PERSON_ID = r.PERSON_ID

    JOIN ACOCO_L2.ONTOLOGY.ENT_MD_GROUP g ON g.MD_GROUP_ID = p.MD_GROUP_ID

    WHERE g.MD_GROUP_NAME = ''Financial Services'''
  verified_by: ACoCo build (CP-07)
  verified_at: 1793059200
  use_as_onboarding_question: false
custom_instructions: Fiscal years run October to September (FY26 = Oct 2025 - Sep 2026); the as-of date is 1 Oct 2026, so
  FY26 is the last closed year. Percentages are 0-100. Filter MD groups by md_group name (e.g. 'Financial Services').
