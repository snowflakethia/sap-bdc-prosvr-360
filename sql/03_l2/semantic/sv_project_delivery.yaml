    synonyms:
    - group code
  - name: md_group
    expr: MD_GROUP_NAME
    data_type: VARCHAR
    description: MD group name, e.g. Financial Services
    synonyms:
    - group
    - industry group
    - practice
  - name: managing_director
    expr: MANAGING_DIRECTOR_NAME
    data_type: VARCHAR
