    synonyms:
    - MD name
    - partner
- name: work_package
  description: Shared ontology entity WORK_PACKAGE (ACOCO_L2.ONTOLOGY.ENT_WORK_PACKAGE)
  base_table:
    database: ACOCO_L2
    schema: ONTOLOGY
    table: ENT_WORK_PACKAGE
  primary_key:
    columns:
    - WBS_ID
  dimensions:
  - name: wbs_id
    expr: WBS_ID
    data_type: VARCHAR
    description: Work package (WBS element)
    synonyms:
    - work package
    - WBS
  - name: is_critical_path
    expr: IS_CRITICAL_PATH
    data_type: BOOLEAN
    description: On the project's critical path
- name: fiscal_month
  description: Shared ontology entity FISCAL_MONTH (ACOCO_L2.CORE.DT_FISCAL_MONTH)
  base_table:
    database: ACOCO_L2
    schema: CORE
    table: DT_FISCAL_MONTH
  primary_key:
    columns:
    - MONTH_START
  dimensions:
  - name: fiscal_year
    expr: FISCAL_YEAR
    data_type: NUMBER
    description: ACoCo fiscal year (Oct-Sep, V9); FY26 = Oct 2025 - Sep 2026
    synonyms:
    - FY
    - year
  - name: fiscal_period
    expr: FISCAL_PERIOD
    data_type: NUMBER
    description: Fiscal period 1-12 (1 = October)
    synonyms:
    - period
  - name: fiscal_quarter
    expr: FISCAL_QUARTER
    data_type: NUMBER
    description: Fiscal quarter 1-4 (1 = Oct-Dec)
    synonyms:
    - quarter
  - name: month_label
    expr: MONTH_LABEL
    data_type: VARCHAR
    description: Calendar month label, e.g. SEP 2026
    synonyms:
    - month
  time_dimensions:
  - name: month_start
    expr: MONTH_START
    data_type: DATE
    description: First day of the fiscal month (join key)
- name: person
  description: Shared ontology entity PERSON (ACOCO_L2.ONTOLOGY.ENT_PERSON)
  base_table:
    database: ACOCO_L2
    schema: ONTOLOGY
    table: ENT_PERSON
  primary_key:
    columns:
    - PERSON_ID
  dimensions:
  - name: person_id
    expr: PERSON_ID
    data_type: VARCHAR
    description: People Intelligence userId
    synonyms:
    - employee id
    - user id
  - name: person_name
    expr: DISPLAY_NAME
    data_type: VARCHAR
    description: Person's display name
    synonyms:
    - name
    - employee
    - consultant
  - name: person_level
    expr: LEVEL
    data_type: VARCHAR
    description: Career level at the as-of date (Analyst .. Principal)
    synonyms:
    - level
    - grade
    - rank
  - name: bill_code
    expr: BILL_CODE
    data_type: NUMBER
    description: Bill code 30-79 within the level band (higher = more senior, more bid time)
    synonyms:
    - billing code
  - name: is_active
    expr: IS_ACTIVE_AS_OF
    data_type: BOOLEAN
    description: Employed on the as-of date (1 Oct 2026)
    synonyms:
    - active
    - current employee
  - name: is_managing_director
    expr: IS_MANAGING_DIRECTOR
    data_type: BOOLEAN
    description: Holds the Managing Director role for a group
    synonyms:
    - MD
  - name: person_source
    expr: SOURCE_SYSTEM
    data_type: VARCHAR
    description: BDC_CLD = real People Intelligence person; SIMULATED = simulated pool
- name: asset
  description: Shared ontology entity ASSET (ACOCO_L2.ONTOLOGY.ENT_ASSET)
  base_table:
    database: ACOCO_L2
    schema: ONTOLOGY
    table: ENT_ASSET
  primary_key:
