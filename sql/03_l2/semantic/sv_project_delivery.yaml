    data_type: VARCHAR
    description: Asset title
    synonyms:
    - accelerator
    - template
  - name: asset_type
    expr: ASSET_TYPE
    data_type: VARCHAR
    description: Accelerator, code template, test pack ...
  - name: asset_work_type
