- name: source_project
  description: Shared ontology entity PROJECT (ACOCO_L2.ONTOLOGY.ENT_PROJECT) in the role source_project
  base_table:
    database: ACOCO_L2
    schema: ONTOLOGY
    table: ENT_PROJECT
  primary_key:
    columns:
    - PROJECT_ID
  dimensions:
  - name: source_project_project_id
    expr: PROJECT_ID
    data_type: VARCHAR
    description: Customer project (S/4 project / WBS)
  - name: source_project_size_class
    expr: SIZE_CLASS
    data_type: VARCHAR
    description: Project size class (XX-Small .. Large)
  - name: source_project_work_type
    expr: WORK_TYPE
    data_type: VARCHAR
    description: Type of work (Data Migration, AI Engineering, ...)
  - name: source_project_contract_type
    expr: CONTRACT_TYPE
    data_type: VARCHAR
    description: FIXED_PRICE or TIME_AND_MATERIALS
  - name: source_project_delivery_model
    expr: DELIVERY_MODEL
    data_type: VARCHAR
    description: HUMAN, HUMAN_AGENT (people + agents) or AGENT_LED
  - name: source_project_project_status
    expr: STATUS_AS_OF
    data_type: VARCHAR
    description: ACTIVE / CLOSED / NOT_STARTED at the as-of date
  - name: source_project_is_story_project
    expr: IS_STORY_PROJECT
    data_type: BOOLEAN
    description: The seeded at-risk FS fixed-price project
- name: project_month
  description: Fact PROJECT_DELIVERY.DT_PROJECT_MONTH_FINANCIALS
  base_table:
    database: ACOCO_L2
    schema: PROJECT_DELIVERY
    table: DT_PROJECT_MONTH_FINANCIALS
  facts:
  - name: revenue
    expr: REVENUE
    data_type: NUMBER
    description: Revenue USD
  - name: total_cost
    expr: TOTAL_COST
    data_type: NUMBER
    description: Total cost USD
  - name: margin
    expr: MARGIN
    data_type: NUMBER
    description: Margin USD
  - name: agent_cost
    expr: AGENT_COST
    data_type: NUMBER
    description: AI-agent cost USD
  - name: agent_hours
    expr: AGENT_HOURS
    data_type: NUMBER
    description: AI-agent hours
  - name: delivery_hours
    expr: DELIVERY_HOURS
    data_type: NUMBER
    description: Delivery hours
  - name: earned_hours
    expr: EARNED_HOURS
    data_type: NUMBER
    description: Earned hours
  metrics:
  - name: total_revenue
    expr: SUM(revenue)
    description: Recognised revenue (USD, S/4 journal GL 0041000000)
    synonyms:
    - sales
    - fees
  - name: total_total_cost
    expr: SUM(total_cost)
    description: People + AI-agent + 35 % overhead cost (USD)
    synonyms:
    - cost
  - name: total_margin
    expr: SUM(margin)
    description: Revenue minus total cost (USD)
    synonyms:
    - profit
  - name: margin_pct
    expr: 100 * SUM(margin) / NULLIF(SUM(revenue), 0)
    description: Margin as % of revenue
    synonyms:
    - profit margin
  - name: total_agent_cost
    expr: SUM(agent_cost)
    description: AI-agent cost charged to projects (S/4 AGT_* allocations, USD)
    synonyms:
    - AI cost
  - name: total_agent_hours
    expr: SUM(agent_hours)
    description: AI-agent hours charged to projects
  - name: productivity_index
    expr: SUM(earned_hours) / NULLIF(SUM(delivery_hours), 0)
    description: Earned hours / actual delivery hours (> 1 = faster than plan)
    synonyms:
    - productivity
- name: project_health
  description: Fact PROJECT_DELIVERY.DT_PROJECT_HEALTH
  base_table:
    database: ACOCO_L2
    schema: PROJECT_DELIVERY
    table: DT_PROJECT_HEALTH
  primary_key:
    columns:
    - PROJECT_ID
  facts:
  - name: project_key
    expr: PROJECT_ID
    data_type: VARCHAR
    description: Project
  - name: earned_value_td
    expr: EARNED_VALUE_TD
    data_type: NUMBER
    description: Earned value to date
  - name: actual_cost_td
    expr: ACTUAL_COST_TD
    data_type: NUMBER
    description: Actual cost to date
  - name: planned_value_td
    expr: PLANNED_VALUE_TD
    data_type: NUMBER
    description: Planned value to date
  - name: contract_value
    expr: CONTRACT_VALUE
    data_type: NUMBER
    description: Contract value
  - name: eac
    expr: EAC
    data_type: NUMBER
    description: Estimate at completion
  - name: ld_exposure
    expr: LD_EXPOSURE
    data_type: NUMBER
    description: LD exposure
  - name: reused_asset
    expr: REUSED_ASSET
    data_type: BOOLEAN
    description: Reused >= 1 asset
  - name: forecast_slip_weeks
    expr: FORECAST_SLIP_WEEKS
    data_type: NUMBER
    description: Forecast slip in weeks
  metrics:
  - name: total_cpi
    expr: SUM(earned_value_td) / NULLIF(SUM(actual_cost_td), 0)
    description: Cost performance index = earned value / actual cost (< 1 = over budget)
    synonyms:
    - cost performance
  - name: total_spi
    expr: SUM(earned_value_td) / NULLIF(SUM(planned_value_td), 0)
    description: Schedule performance index = earned value / planned value (< 1 = late)
    synonyms:
    - schedule performance
  - name: total_forecast_margin_pct
    expr: 100 * (SUM(contract_value) - SUM(eac) - SUM(ld_exposure)) / NULLIF(SUM(contract_value), 0)
    description: (Contract - EAC - LD exposure) / contract
    synonyms:
    - forecast profitability
  - name: total_ld_exposure
    expr: SUM(ld_exposure)
    description: Liquidated damages exposure on late fixed-price projects (USD)
    synonyms:
    - penalties
  - name: total_eac
    expr: SUM(eac)
    description: Estimate at completion = sold cost / CPI (USD)
  - name: project_count
    expr: COUNT(DISTINCT project_key)
    description: Number of projects
    synonyms:
    - projects
  - name: asset_reuse_rate_pct
    expr: 100 * AVG(IFF(reused_asset, 1, 0))
    description: Projects with >= 1 recorded asset use / projects
    synonyms:
    - reuse rate
- name: project_team
  description: Fact PROJECT_DELIVERY.DT_PROJECT_TEAM
  base_table:
    database: ACOCO_L2
    schema: PROJECT_DELIVERY
    table: DT_PROJECT_TEAM
  facts:
  - name: delivery_hours
    expr: DELIVERY_HOURS
    data_type: NUMBER
    description: Delivery hours on the project
  metrics:
  - name: team_delivery_hours
    expr: SUM(delivery_hours)
    description: Delivery hours booked by the person on the project
- name: asset_use
  description: Fact ONTOLOGY.REL_ASSET_USE
  base_table:
    database: ACOCO_L2
    schema: ONTOLOGY
    table: REL_ASSET_USE
  primary_key:
    columns:
    - ASSET_USE_ID
  facts:
  - name: hours_saved_estimated
    expr: HOURS_SAVED_ESTIMATED
    data_type: NUMBER
    description: ESTIMATED hours saved
  - name: uses
    expr: '1'
    data_type: NUMBER
    description: One recorded use
  metrics:
  - name: total_hours_saved_estimated
    expr: SUM(hours_saved_estimated)
    description: ESTIMATED hours saved by asset reuse (catalogued saving per use)
  - name: asset_uses
    expr: SUM(uses)
    description: Recorded asset uses
- name: asset_match
  description: Fact REASONING.VW_ASSET_MATCH
  base_table:
    database: ACOCO_L2
    schema: REASONING
    table: VW_ASSET_MATCH
  dimensions:
  - name: reuse_status
    expr: REUSE_STATUS
    data_type: VARCHAR
    description: REUSED or MISSED
  - name: same_work_type
    expr: SAME_WORK_TYPE
    data_type: BOOLEAN
    description: Asset built for the same work type
  facts:
  - name: similarity
    expr: SIMILARITY
    data_type: FLOAT
    description: Semantic similarity of the work package need and the asset
  - name: effort_saving_hours
    expr: EFFORT_SAVING_HOURS
    data_type: NUMBER
    description: Catalogued effort saving (ESTIMATED)
  metrics:
  - name: missed_reuse_hours
    expr: SUM(IFF(reuse_status = 'MISSED', effort_saving_hours, 0))
    description: ESTIMATED hours a matching asset would have saved but was not reused
- name: wp_skill
  description: Fact ONTOLOGY.REL_WP_SKILL
  base_table:
    database: ACOCO_L2
    schema: ONTOLOGY
    table: REL_WP_SKILL
  facts:
  - name: required_proficiency
    expr: REQUIRED_PROFICIENCY
    data_type: NUMBER
    description: Required proficiency
- name: asset_skill
  description: Fact ONTOLOGY.REL_ASSET_SKILL
  base_table:
    database: ACOCO_L2
    schema: ONTOLOGY
    table: REL_ASSET_SKILL
