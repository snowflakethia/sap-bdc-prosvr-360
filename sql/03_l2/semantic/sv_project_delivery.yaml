verified_queries:
- name: vq_1
  question: Which active Financial Services projects have a negative forecast margin?
  sql: "SELECT h.PROJECT_ID, h.SIZE_CLASS, h.CONTRACT_TYPE, ROUND(h.CPI, 2) AS CPI, ROUND(h.SPI, 2) AS SPI,\n       ROUND(100\
    \ * h.FORECAST_MARGIN_PCT, 1) AS FORECAST_MARGIN_PCT, ROUND(h.LD_EXPOSURE, 0) AS LD_EXPOSURE\nFROM ACOCO_L2.PROJECT_DELIVERY.DT_PROJECT_HEALTH\
    \ h\nJOIN ACOCO_L2.ONTOLOGY.ENT_MD_GROUP g ON g.MD_GROUP_ID = h.MD_GROUP_ID\nWHERE g.MD_GROUP_NAME = 'Financial Services'\
    \ AND h.STATUS_AS_OF = 'ACTIVE' AND h.FORECAST_MARGIN_PCT < 0\nORDER BY h.FORECAST_MARGIN_PCT"
  verified_by: ACoCo build (CP-07)
  verified_at: 1793059200
  use_as_onboarding_question: true
- name: vq_2
  question: What was FY26 margin % by delivery model?
  sql: 'SELECT p.DELIVERY_MODEL, ROUND(100 * SUM(m.MARGIN) / SUM(m.REVENUE), 1) AS MARGIN_PCT

    FROM ACOCO_L2.PROJECT_DELIVERY.DT_PROJECT_MONTH_FINANCIALS m

    JOIN ACOCO_L2.ONTOLOGY.ENT_WORK_PACKAGE w ON w.WBS_ID = m.WBS_ID

    JOIN ACOCO_L2.ONTOLOGY.ENT_PROJECT p ON p.PROJECT_ID = w.PROJECT_ID

    JOIN ACOCO_L2.CORE.DT_FISCAL_MONTH f ON f.MONTH_START = m.MONTH_START

    WHERE f.FISCAL_YEAR = 2026 GROUP BY p.DELIVERY_MODEL ORDER BY MARGIN_PCT DESC'
  verified_by: ACoCo build (CP-07)
  verified_at: 1793059200
  use_as_onboarding_question: false
custom_instructions: Fiscal years run October to September (FY26 = Oct 2025 - Sep 2026); the as-of date is 1 Oct 2026, so
  FY26 is the last closed year. Percentages are 0-100. Filter MD groups by md_group name (e.g. 'Financial Services').
