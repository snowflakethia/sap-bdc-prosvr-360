name: SV_PROJECT_DELIVERY
description: 'Operational Excellence pillar: project P&L, earned value (CPI, SPI, EAC), liquidated-damages exposure, forecast
  margin, teams, asset reuse and the skills work packages need.'
tables:
- name: project
  description: Shared ontology entity PROJECT (ACOCO_L2.ONTOLOGY.ENT_PROJECT)
  base_table:
    database: ACOCO_L2
    schema: ONTOLOGY
    table: ENT_PROJECT
  primary_key:
    columns:
    - PROJECT_ID
  dimensions:
  - name: project_id
    expr: PROJECT_ID
    data_type: VARCHAR
    description: Customer project (S/4 project / WBS)
    synonyms:
    - project
    - engagement
  - name: size_class
    expr: SIZE_CLASS
    data_type: VARCHAR
    description: Project size class (XX-Small .. Large)
    synonyms:
    - size
  - name: work_type
    expr: WORK_TYPE
    data_type: VARCHAR
    description: Type of work (Data Migration, AI Engineering, ...)
    synonyms:
    - service line
  - name: contract_type
    expr: CONTRACT_TYPE
    data_type: VARCHAR
    description: FIXED_PRICE or TIME_AND_MATERIALS
    synonyms:
    - pricing
  - name: delivery_model
    expr: DELIVERY_MODEL
    data_type: VARCHAR
    description: HUMAN, HUMAN_AGENT (people + agents) or AGENT_LED
    synonyms:
    - AI delivery model
  - name: project_status
    expr: STATUS_AS_OF
    data_type: VARCHAR
    description: ACTIVE / CLOSED / NOT_STARTED at the as-of date
    synonyms:
    - status
  - name: is_story_project
    expr: IS_STORY_PROJECT
    data_type: BOOLEAN
    description: The seeded at-risk FS fixed-price project
- name: customer
  description: Shared ontology entity CUSTOMER (ACOCO_L2.ONTOLOGY.ENT_CUSTOMER)
  base_table:
    database: ACOCO_L2
    schema: ONTOLOGY
    table: ENT_CUSTOMER
  primary_key:
    columns:
    - CUSTOMER_ID
  dimensions:
  - name: customer_id
    expr: CUSTOMER_ID
    data_type: VARCHAR
    description: Customer account id
  - name: customer_name
    expr: CUSTOMER_NAME
    data_type: VARCHAR
    description: Customer account name
    synonyms:
