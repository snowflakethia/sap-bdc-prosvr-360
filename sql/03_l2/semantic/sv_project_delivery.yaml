    - account
- name: md_group
  description: Shared ontology entity MD_GROUP (ACOCO_L2.ONTOLOGY.ENT_MD_GROUP)
  base_table:
    database: ACOCO_L2
    schema: ONTOLOGY
    table: ENT_MD_GROUP
  primary_key:
    columns:
    - MD_GROUP_ID
  dimensions:
  - name: md_group_id
    expr: MD_GROUP_ID
    data_type: VARCHAR
